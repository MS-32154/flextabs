name: Publish to PyPI

on:
  release:
    types: [published]
  # Manual runs build and check the package without uploading (a dry run)
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    # Lint and the full test suite must pass before anything is published
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Build sdist and wheel
        run: uv build

      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match package version '$version'"
            exit 1
          fi
          echo "Publishing flextabs $version"

      - name: Check package metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/flextabs/
    permissions:
      id-token: write # for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Uses the API token while it exists. To switch to trusted publishing,
          # add this repository/workflow/environment ("pypi") as a trusted
          # publisher on PyPI, then delete the PYPI_API_TOKEN secret.
          password: ${{ secrets.PYPI_API_TOKEN }}
