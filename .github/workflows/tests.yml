name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Ruff lint
        run: uv run ruff check flextabs tests
      - name: Ruff format
        run: uv run ruff format --check flextabs tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install a virtual X display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Run tests
        run: xvfb-run -a uv run pytest --cov=flextabs --cov-report=term-missing
