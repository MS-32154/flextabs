[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flextabs"
version = "0.2.0"
description = "A flexible and extensible tab manager widget for tkinter applications built on top of ttk.Notebook"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
authors = [
    {name = "MS-32154", email = "msttoffg@gmail.com"}
]
keywords = ["tkinter", "ttk", "Notebook", "tabs", "gui", "widget", "interface"]
dependencies = ["Pillow",]

[project.urls]
Homepage = "https://github.com/MS-32154/flextabs"
"Bug Reports" = "https://github.com/MS-32154/flextabs/issues"
Source = "https://github.com/MS-32154/flextabs"
[tool.ruff]
target-version = "py315"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "PIE", "BLE", "RUF", "I"]
ignore = [
    "B027",   # TabContent/TabOpener hooks are intentionally empty, overridable defaults
    "RUF001", # emoji/unicode glyphs in UI strings are intentional
]
